name = "plausible-mcp"

account_id = "2b127abbae3a5a0925326a29b5048102"
main = "src/worker.ts"
compatibility_date = "2025-01-01"

# Node built-ins for the SDK + protection for public-only fetches.
compatibility_flags = ["nodejs_compat_v2", "global_fetch_strictly_public"]


[vars]

# Email domain allowed to sign in to /internal.
ALLOWED_EMAIL_DOMAIN = "md-import.dk"

# We are not using Cloudflare Access service tokens.
ALLOWED_SERVICE_TOKEN_IDS = ""

# Hostnames accepted by the MCP endpoints.
MCP_ALLOWED_HOSTNAMES = "plausible-mcp.cust682.workers.dev,localhost,127.0.0.1"

# Browser origins. Leave unchanged for now.
MCP_ALLOWED_ORIGIN_HOSTNAMES = "claude.ai,localhost,127.0.0.1"

# Your Cloudflare Access team domain.
CF_ACCESS_TEAM_DOMAIN = "https://quiet-base-6a84.cloudflareaccess.com"

# IMPORTANT:
# Replace ONLY the text INDSAET_DIN_AUD_TAG_HER below
# with the AUD tag shown in Cloudflare.
CF_ACCESS_AUD = "ceff0c568cfcfa59226ab69e47fbed9ad5a36d78d6bfd2725f44617b5bf3f91e"


[dev]
port = 8787

# PLAUSIBLE_API_KEY must remain a Cloudflare secret.
# Do NOT put the Plausible API key in this file.


[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 60, period = 60 }
